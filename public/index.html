<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Web Terminal</title>
<style>
  :root {
    --bg: #0b0d10;
    --panel: #12161a;
    --green: #39ff88;
    --dim: #5f7a6b;
    --red: #ff5c5c;
    --border: #1e2530;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    font-family: "SF Mono", "Fira Code", "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
    color: var(--green);
  }
  #login-screen, #term-screen {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #term-screen { display: none; align-items: stretch; justify-content: stretch; padding: 0; }

  .login-box {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 36px 40px;
    width: 340px;
    box-shadow: 0 0 40px rgba(57, 255, 136, 0.06);
  }
  .login-box h1 {
    font-size: 16px;
    letter-spacing: 1px;
    margin: 0 0 4px;
    color: var(--green);
  }
  .login-box p {
    color: var(--dim);
    font-size: 12px;
    margin: 0 0 20px;
  }
  .login-box input {
    width: 100%;
    background: #0b0d10;
    border: 1px solid var(--border);
    color: var(--green);
    padding: 10px 12px;
    border-radius: 6px;
    font-family: inherit;
    font-size: 14px;
    outline: none;
  }
  .login-box input:focus { border-color: var(--green); }
  .login-box button {
    margin-top: 14px;
    width: 100%;
    background: var(--green);
    color: #04140b;
    border: none;
    padding: 10px 12px;
    border-radius: 6px;
    font-weight: 600;
    font-family: inherit;
    font-size: 14px;
    cursor: pointer;
  }
  .login-box button:hover { filter: brightness(1.08); }
  #login-error {
    color: var(--red);
    font-size: 12px;
    margin-top: 10px;
    min-height: 14px;
  }

  #term {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
  }
  #titlebar {
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 8px 14px;
    font-size: 12px;
    color: var(--dim);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  #titlebar .dot { color: var(--dim); }
  #logout {
    background: none;
    border: 1px solid var(--border);
    color: var(--dim);
    font-family: inherit;
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 4px;
    cursor: pointer;
  }
  #logout:hover { color: var(--red); border-color: var(--red); }

  #output {
    flex: 1;
    overflow-y: auto;
    padding: 14px 16px;
    font-size: 13px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .line-cmd { color: #9fe8c0; }
  .line-cmd .prompt { color: var(--green); font-weight: bold; }
  .line-err { color: var(--red); }
  .line-out { color: #d7e6dd; }
  .line-sys { color: var(--dim); font-style: italic; }

  #inputline {
    display: flex;
    align-items: center;
    padding: 8px 16px 14px;
    border-top: 1px solid var(--border);
  }
  #inputline .prompt {
    color: var(--green);
    font-weight: bold;
    margin-right: 8px;
    font-size: 13px;
    white-space: nowrap;
  }
  #cmd {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: #eafff2;
    font-family: inherit;
    font-size: 13px;
  }
  #output::-webkit-scrollbar { width: 8px; }
  #output::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <h1>&gt; SECURE SHELL ACCESS</h1>
    <p>Authenticate to open a real sandboxed terminal session.</p>
    <input id="password" type="password" placeholder="Password" autocomplete="off" />
    <button id="login-btn">Connect</button>
    <div id="login-error"></div>
  </div>
</div>

<div id="term-screen">
  <div id="term">
    <div id="titlebar">
      <span><span class="dot">●</span> web-terminal — sandboxed session</span>
      <button id="logout">disconnect</button>
    </div>
    <div id="output"></div>
    <div id="inputline">
      <span class="prompt" id="prompt-label">$</span>
      <input id="cmd" type="text" autocomplete="off" spellcheck="false" />
    </div>
  </div>
</div>

<script>
  const loginScreen = document.getElementById('login-screen');
  const termScreen = document.getElementById('term-screen');
  const passwordInput = document.getElementById('password');
  const loginBtn = document.getElementById('login-btn');
  const loginError = document.getElementById('login-error');
  const output = document.getElementById('output');
  const cmdInput = document.getElementById('cmd');
  const promptLabel = document.getElementById('prompt-label');
  const logoutBtn = document.getElementById('logout');

  let token = sessionStorage.getItem('term_pw') || '';
  let cwd = sessionStorage.getItem('term_cwd') || '/tmp';
  let history = [];
  let historyIndex = -1;

  function appendLine(text, cls) {
    const div = document.createElement('div');
    div.className = cls;
    div.textContent = text;
    output.appendChild(div);
    output.scrollTop = output.scrollHeight;
  }

  function shortCwd() {
    return cwd.length > 40 ? '…' + cwd.slice(-40) : cwd;
  }

  function updatePrompt() {
    promptLabel.textContent = shortCwd() + ' $';
  }

  async function login() {
    const pw = passwordInput.value;
    if (!pw) return;
    loginError.textContent = '';
    loginBtn.disabled = true;
    loginBtn.textContent = 'Connecting…';
    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: pw }),
      });
      const data = await res.json();
      if (!res.ok) {
        loginError.textContent = data.error || 'Login failed';
        return;
      }
      token = pw;
      sessionStorage.setItem('term_pw', pw);
      enterTerminal();
    } catch (e) {
      loginError.textContent = 'Connection error';
    } finally {
      loginBtn.disabled = false;
      loginBtn.textContent = 'Connect';
    }
  }

  function enterTerminal() {
    loginScreen.style.display = 'none';
    termScreen.style.display = 'flex';
    updatePrompt();
    appendLine('Connected. Real shell commands run in a sandboxed, ephemeral server-side session.', 'line-sys');
    appendLine('Type "help" for tips.', 'line-sys');
    cmdInput.focus();
  }

  function logout() {
    sessionStorage.removeItem('term_pw');
    sessionStorage.removeItem('term_cwd');
    token = '';
    cwd = '/tmp';
    output.innerHTML = '';
    termScreen.style.display = 'none';
    loginScreen.style.display = 'flex';
    passwordInput.value = '';
    passwordInput.focus();
  }

  async function runCommand(command) {
    appendLine(shortCwd() + ' $ ' + command, 'line-cmd');

    if (command.trim() === 'clear') {
      output.innerHTML = '';
      return;
    }
    if (command.trim() === 'help') {
      appendLine('This is a real bash shell running inside an isolated, ephemeral server function.\nEach command is a fresh invocation; "cd" persists across commands in this session.\nType "clear" to clear the screen, "logout" to disconnect.', 'line-sys');
      return;
    }
    if (command.trim() === 'logout') {
      logout();
      return;
    }

    try {
      const res = await fetch('/api/terminal', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + token,
        },
        body: JSON.stringify({ command, cwd }),
      });

      if (res.status === 401) {
        appendLine('Session expired or unauthorized. Please log in again.', 'line-err');
        logout();
        return;
      }

      const data = await res.json();
      if (data.error) {
        appendLine(data.error, 'line-err');
        return;
      }
      if (data.stdout) appendLine(data.stdout.replace(/\n$/, ''), 'line-out');
      if (data.stderr) appendLine(data.stderr.replace(/\n$/, ''), 'line-err');
      if (data.cwd) {
        cwd = data.cwd;
        sessionStorage.setItem('term_cwd', cwd);
        updatePrompt();
      }
    } catch (e) {
      appendLine('Network error: ' + e.message, 'line-err');
    }
  }

  loginBtn.addEventListener('click', login);
  passwordInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') login();
  });

  cmdInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      const command = cmdInput.value;
      cmdInput.value = '';
      if (command.trim()) {
        history.push(command);
        historyIndex = history.length;
        runCommand(command);
      }
    } else if (e.key === 'ArrowUp') {
      if (historyIndex > 0) {
        historyIndex--;
        cmdInput.value = history[historyIndex] || '';
      }
      e.preventDefault();
    } else if (e.key === 'ArrowDown') {
      if (historyIndex < history.length) {
        historyIndex++;
        cmdInput.value = history[historyIndex] || '';
      }
      e.preventDefault();
    }
  });

  logoutBtn.addEventListener('click', logout);

  if (token) {
    enterTerminal();
  } else {
    passwordInput.focus();
  }
</script>
</body>
</html>
